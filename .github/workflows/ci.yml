name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libudev-dev libdbus-1-dev libx11-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libevdev-dev xvfb
          if [ "${{ matrix.compiler }}" = "clang" ]; then sudo apt-get install -y clang; fi

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (gcc/clang)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Configure (MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Setup Mesa OpenGL (Windows)
        if: runner.os == 'Windows'
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          path: ${{github.workspace}}/build

      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: x11
        run: xvfb-run --auto-servernum ctest --test-dir build --output-on-failure

      - name: Copy Mesa DLL to tests (Windows)
        if: runner.os == 'Windows'
        run: copy build\opengl32.dll build\tests\opengl32.dll
        
      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure
